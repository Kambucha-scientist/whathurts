<div class="panel table-wrap"><table><tr><th>Дата</th><th>Врач</th><th>Пациент</th><th>Диагноз</th><th></th></tr>{% for c in calls %}<tr><td>{{ c.datetime.strftime('%d.%m.%Y %H:%M') }}</td><td>{{ c.doctor.full_name }}</td><td>{{ c.patient.full_name }}</td><td>{{ c.diagnosis }}</td><td><a href="{{ url_for('calls.call_detail',call_id=c.id) }}">Открыть</a></td></tr>{% else %}<tr><td colspan="5">Вызовов нет.</td></tr>{% endfor %}</table></div>
