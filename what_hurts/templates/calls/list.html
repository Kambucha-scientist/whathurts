{% extends "base.html" %}{% block content %}<h1>Все вызовы</h1><form class="filters" method="get"><label>С даты<input type="date" name="start_date" value="{{ filters.get('start_date','') }}"></label><label>По дату<input type="date" name="end_date" value="{{ filters.get('end_date','') }}"></label><label>Врач<select name="doctor_id"><option value="">Все</option>{% for d in doctors %}<option value="{{ d.id }}" {% if filters.get('doctor_id')|int == d.id %}selected{% endif %}>{{ d.full_name }}</option>{% endfor %}</select></label><label>Пациент<select name="patient_id"><option value="">Все</option>{% for p in patients %}<option value="{{ p.id }}" {% if filters.get('patient_id')|int == p.id %}selected{% endif %}>{{ p.full_name }}</option>{% endfor %}</select></label><button class="button">Фильтровать</button></form>{% include "calls/_table.html" %}{% endblock %}
