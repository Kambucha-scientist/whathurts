{% extends "base.html" %}{% block content %}<h1>{{ title }}</h1><section class="panel"><form method="post">{{ form.hidden_tag() }}{% for field in [form.full_name,form.birth_date,form.phone,form.address] %}<label>{{ field.label }}{{ field() }}{% for e in field.errors %}<small class="error">{{ e }}</small>{% endfor %}</label>{% endfor %}{{ form.submit(class_="button") }}</form></section>{% endblock %}
