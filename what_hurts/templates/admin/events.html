{% extends "base.html" %}{% block content %}<h1>Журнал событий</h1><div class="panel table-wrap"><table><tr><th>Время (UTC)</th><th>Пользователь ID</th><th>Действие</th><th>Детали</th></tr>{% for e in events %}<tr><td>{{ e.timestamp.strftime('%d.%m.%Y %H:%M:%S') }}</td><td>{{ e.user_id or '—' }}</td><td>{{ e.action }}</td><td>{{ e.details }}</td></tr>{% endfor %}</table></div>{% endblock %}
