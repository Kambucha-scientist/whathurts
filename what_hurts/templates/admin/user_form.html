{% extends "base.html" %}{% block content %}<h1>{{ title }}</h1><section class="panel"><form method="post">{{ form.hidden_tag() }}{% for field in [form.full_name,form.username,form.role,form.password,form.is_active] %}<label>{{ field.label }}{{ field() }}{% for e in field.errors %}<small class="error">{{ e }}</small>{% endfor %}</label>{% endfor %}<p class="hint">При редактировании оставьте пароль пустым, если сброс не нужен.</p>{{ form.submit(class_="button") }}</form></section>{% endblock %}
