{% extends "base.html" %}{% block content %}<h1>Пользователи</h1><a class="button" href="{{ url_for('admin.create_user') }}">Создать пользователя</a><div class="panel table-wrap"><table><tr><th>ФИО</th><th>Логин</th><th>Роль</th><th>Активен</th><th></th></tr>{% for u in users %}<tr><td>{{ u.full_name }}</td><td>{{ u.username }}</td><td>{{ u.role }}</td><td>{{ 'Да' if u.is_active else 'Нет' }}</td><td><a href="{{ url_for('admin.edit_user',user_id=u.id) }}">Изменить</a></td></tr>{% endfor %}</table></div>{% endblock %}
